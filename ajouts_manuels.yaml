# Événements ajoutés à la main (trouvés ailleurs : Fäger, affiche dans le quartier, message d'école…).
#
# Comment faire :
#   1. Copie le modèle ci-dessous sous la ligne « evenements: » et retire les « # » au début des lignes.
#      Garde les deux espaces avant le tiret et les quatre espaces avant les autres lignes.
#   2. Efface les crochets « [] » à la fin de la dernière ligne dès qu'il y a une fiche
#      (les crochets veulent dire « liste vide »).
#   3. Lance « python recuperer.py » : le terminal dit si une fiche a un problème.
#
# Obligatoire : titre, debut, lieu_nom. Tout le reste est facultatif.
# Dates : "2026-11-20 14:00" (entre guillemets). Les événements passés disparaissent tout seuls.
# Catégories possibles : atelier, conte, spectacle, musique, nature, sport, fête, visite
#
# Modèle complet (exemple inventé) :
#  - titre: Zirkus-Nachmittag
#    debut: "2026-11-20 14:00"
#    fin: "2026-11-20 16:00"
#    lieu_nom: Quartierzentrum
#    adresse: Beispielstrasse 1, 3000 Bern
#    description_courte: Jonglage et acrobatie pour les petits.
#    age_min: 5
#    age_max: 10
#    prix: gratuit            # ou « 10 CHF », ou « inconnu »
#    inscription_requise: true
#    categorie: sport
#    source: Fäger            # sinon « Ajout manuel »
#    url_source: https://exemple.ch/zirkus
#
# Modèle minimal (exemple inventé) :
#  - titre: Kasperlitheater
#    debut: "2026-11-21 15:00"
#    lieu_nom: Quartierzentrum

