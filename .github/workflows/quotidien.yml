# Mise à jour quotidienne de l'agenda, sur les serveurs de GitHub (sans ton ordinateur).
# Chaque nuit : tests, récupération des événements, puis enregistrement de docs/events.json
# si quelque chose a changé. GitHub Pages republie alors le site tout seul.

name: Mise à jour quotidienne

on:
  schedule:
    # 4:00 UTC = 5:00 à Berne en hiver (6:00 en été). GitHub peut avoir quelques minutes de retard.
    - cron: "0 4 * * *"
  # Bouton « Run workflow » dans l'onglet Actions, pour lancer à la main
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour enregistrer events.json dans le dépôt

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Zurich   # les heures du script sont celles de Berne

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les bibliothèques
        run: pip install -r requirements.txt

      - name: Lancer les tests
        run: python -m pytest -q

      - name: Récupérer les événements
        run: python recuperer.py
        env:
          # Jeton de l'API Eventfrog, rangé dans les secrets du dépôt (jamais dans le code)
          EVENTFROG_TOKEN: ${{ secrets.EVENTFROG_TOKEN }}

      - name: Enregistrer events.json, agenda.ics et lieux.json s'ils ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/events.json docs/agenda.ics docs/lieux.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Mise à jour des événements du $(date +'%d.%m.%Y')"
            git push
          fi
