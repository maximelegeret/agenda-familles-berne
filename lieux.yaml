# Lieux permanents pour l'onglet « Sortir » (V3, Lot A).
# Liste validée par Maxime le 9 nov. 2026 ; infos relevées sur les sites officiels le même jour.
# À revérifier une fois par an (ou quand un lieu change ses horaires) : mettre à jour « verifie_le ».
#
# Champs :
#   id           identifiant court, unique
#   nom          nom affiché
#   type         animaux | nature | musee | piscine | jeux | bibliotheque | rencontre
#   dedans       true (couvert), false (dehors) ou "mixte" (les deux)
#   adresse, lat, lng   coordonnées OpenStreetMap (Nominatim), vérifiées
#   age_min      âge conseillé minimum (facultatif)
#   prix         texte court en français ; « gratuit » si rien à payer
#   resume       une ou deux phrases : pourquoi y aller avec des petits
#   horaires     « toujours » (accès libre jour et nuit) ou liste de périodes :
#                  - du: "MM-JJ"  au: "MM-JJ"   (facultatif : toute l'année si absent)
#                    lun/mar/mer/jeu/ven/sam/dim: "HH:MM-HH:MM" (jour absent = fermé ;
#                    plusieurs plages séparées par une virgule)
#   feries       horaires des jours fériés : "ferme", "normal" (comme un jour ordinaire) ou "HH:MM-HH:MM"
#   fermetures   jours fermés en plus : dates "MM-JJ" ou noms de fêtes mobiles
#                (vendredi_saint, paques, lundi_paques, ascension, pentecote, lundi_pentecote, zibelemarit)
#   equipements  langer (table à langer), poussette, cafe, wc, jeux (place de jeux)
#   remarque     ce qu'il faut savoir avant d'y aller (facultatif)
#   url          page officielle des horaires
#   verifie_le   date de la dernière vérification

