# Liste des sources d'événements.
# Pour chaque source :
#   nom     : nom affiché sur le site
#   lecteur : nom du fichier Python dans agenda/lecteurs/ (sans .py)
#   url     : page ou API de départ
#   actif   : true = lue chaque jour ; false = ignorée (lecteur pas encore écrit, ou en pause)
#   pour_enfants : true si la source ne donne que des activités pour enfants
#                  (sinon le tri par mots-clés écarte ce qui ne mentionne pas les enfants)
#
# Pour ajouter une source : donne l'URL à Claude Code, il écrit le lecteur et ajoute une ligne ici.

sources:
  - nom: Kornhausbibliotheken
    lecteur: kob
    url: https://www.kob.ch/agenda/
    actif: true
    pour_enfants: true   # le lecteur ne garde que les catégories enfants ou les fiches avec un âge

  - nom: Creaviva (Zentrum Paul Klee)
    lecteur: creaviva
    url: https://zpk.org/de/creaviva
    actif: true
    pour_enfants: true   # le Creaviva est l'atelier pour enfants ; les cours adultes sont écartés par le lecteur
    espace: 18           # numéro du Creaviva dans l'API (7 = Kunstmuseum, pour la vague 2)

  - nom: MuseumsQuartier Bern
    lecteur: mqb
    url: https://www.mqb.ch/en/agenda
    actif: true
    pour_enfants: true   # le lecteur filtre déjà sur le public « Children & Family » du site

  - nom: Yehudi Menuhin Forum
    lecteur: menuhin
    url: https://menuhinforum.ch/konzertkalender/
    actif: true
    pour_enfants: true   # le lecteur ne garde que les concerts « Familie / Kinder »

  - nom: Bühnen Bern
    lecteur: buehnenbern
    url: https://buehnenbern.ch/spielplan/programm/
    actif: true
    pour_enfants: false  # « Junges Publikum » inclut des pièces pour ados : le tri par âge s'applique

  - nom: Eventfrog
    lecteur: eventfrog
    url: https://api.eventfrog.net/public/v1/events
    actif: false   # étape 12, quand le jeton sera arrivé
