# Liste des sources d'événements.
# Pour chaque source :
#   nom     : nom affiché sur le site
#   lecteur : nom du fichier Python dans agenda/lecteurs/ (sans .py)
#   url     : page ou API de départ
#   actif   : true = lue chaque jour ; false = ignorée (lecteur pas encore écrit, ou en pause)
#   pour_enfants : true si la source ne donne que des activités pour enfants
#                  (sinon le tri par mots-clés écarte ce qui ne mentionne pas les enfants)
#
# Pour ajouter une source : donne l'URL à Claude Code, il écrit le lecteur et ajoute une ligne ici.

sources:
  - nom: Kornhausbibliotheken
    lecteur: kob
    url: https://www.kob.ch/agenda/
    actif: true
    pour_enfants: true   # le lecteur ne garde que les catégories enfants ou les fiches avec un âge

  - nom: Creaviva (Zentrum Paul Klee)
    lecteur: creaviva
    url: https://zpk.org/de/creaviva
    actif: true
    pour_enfants: true   # le Creaviva est l'atelier pour enfants ; les cours adultes sont écartés par le lecteur
    espace: 18           # numéro du Creaviva dans l'API (7 = Kunstmuseum, pour la vague 2)

  - nom: MuseumsQuartier Bern
    lecteur: mqb
    url: https://www.mqb.ch/en/agenda
    actif: true
    pour_enfants: true   # le lecteur filtre déjà sur le public « Children & Family » du site

  - nom: Yehudi Menuhin Forum
    lecteur: menuhin
    url: https://menuhinforum.ch/konzertkalender/
    actif: true
    pour_enfants: true   # le lecteur ne garde que les concerts « Familie / Kinder »

  - nom: Bühnen Bern
    lecteur: buehnenbern
    url: https://buehnenbern.ch/spielplan/programm/
    actif: true
    pour_enfants: false  # « Junges Publikum » inclut des pièces pour ados : le tri par âge s'applique

  - nom: Berner Puppen Theater
    lecteur: puppentheater
    url: https://www.berner-puppentheater.ch/spielplan
    actif: true
    pour_enfants: true   # le lecteur ne garde que le « Kinderprogramm »

  - nom: Schlachthaus Theater
    lecteur: schlachthaus
    url: https://www.schlachthaus.ch/de/programm/shows/
    actif: true
    pour_enfants: false  # le lecteur garde les âges ≤ 10 ans ; le tri général vérifie encore

  - nom: Tierpark Bern
    lecteur: tierpark
    url: https://tierpark-bern.ch/veranstaltungskalender/
    actif: true
    pour_enfants: true   # le lecteur garde les activités marquées « Event für Kinder » par le Tierpark

  - nom: Naturhistorisches Museum Bern
    lecteur: nmbe
    url: https://www.nmbe.ch/de/kalender
    actif: true
    pour_enfants: true   # le lecteur utilise le filtre « Familien und Kinder » du musée

  - nom: MüZe Muri-Gümligen
    lecteur: mueze
    url: https://www.mueze-muri-guemligen.ch/angebot/veranstaltungen/
    actif: true
    pour_enfants: true   # le lecteur écarte les rendez-vous parents (consultation, allaitement) et le Repair-Café

  - nom: Dampfzentrale Bern
    lecteur: dampfzentrale
    url: https://www.dampfzentrale.ch/
    actif: true
    pour_enfants: false  # rubrique « Junges Publikum » : inclut des offres ados, le tri par âge s'applique

  - nom: Botanischer Garten Bern
    lecteur: boga
    url: https://www.boga.unibe.ch/agenda/index_ger.html
    actif: true
    pour_enfants: true   # le lecteur garde les rubriques Kinderfreizeit et Thementage

  - nom: Eventfrog
    lecteur: eventfrog
    url: https://api.eventfrog.net/public/v1/events
    actif: false   # étape 12, quand le jeton sera arrivé
